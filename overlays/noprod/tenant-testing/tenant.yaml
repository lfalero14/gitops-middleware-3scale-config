apiVersion: capabilities.3scale.net/v1alpha1
kind: Tenant
metadata:
  name: 3scale-testing
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
    insecure_skip_verify: true
spec:
  username: admin
  systemMasterUrl: ""
  email: admin@telefonica.com
  organizationName: 3scale-testing
  masterCredentialsRef:
    name: system-seed
    namespace: 3scale
  passwordCredentialsRef:
    name: testing-admin-secret
    namespace: 3scale
  tenantSecretRef:
    name: testing-tenant-secret #It is created automatically
    namespace: 3scale
